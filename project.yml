# XcodeGen 工程定义 —— 由 ios-ci-workflows 的 generate_command 自动生成 .xcodeproj
# 洛雪音乐 iOS 版（Liquid Glass / iOS 26）
name: LuoxueMusic
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.2.6
    CURRENT_PROJECT_VERSION: 13
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: false
    PRODUCT_BUNDLE_IDENTIFIER: com.example.luoxuemusic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: LuoxueMusic/Info.plist
    ENABLE_USER_SELECTED_FILES: false
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
targets:
  LuoxueMusic:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: LuoxueMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.luoxuemusic
        INFOPLIST_FILE: LuoxueMusic/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LuoxueMusicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: LuoxueMusicTests
    dependencies:
      - target: LuoxueMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.luoxuemusic.tests
        GENERATE_INFOPLIST_FILE: true
